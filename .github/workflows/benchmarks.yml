name: Benchmarks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  synthetic-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-simulation.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_references.py --check
      - run: python examples/mrs_current_benchmark.py --output /tmp/synthetic-mrs-current
      - run: python examples/tank_benchmark.py --output /tmp/synthetic-tank --plot
  fem-benchmarks:
    runs-on: ubuntu-24.04
    env:
      # The reference is serial. Hosted runners may expose an unusable RDMA
      # device; avoid UCX probing verbs/mana during MPI initialization.
      UCX_TLS: self,sm,tcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libglu1-mesa
      - run: python -m pip install -r requirements-fem.txt
      - run: python -m pip install matplotlib
      # Fail explicitly on missing native dependencies; optional tests may not all skip.
      - run: python -c 'import dolfinx, gmsh, scipy; from mpi4py import MPI; print(dolfinx.__version__, gmsh.__version__, MPI.Get_library_version())'
      - run: python -m unittest discover -s tests -p 'test_fem*.py' -v
      - run: python examples/fem_benchmark.py --output /tmp/synthetic-fem --plot
      - run: python examples/fem_adaptive_benchmark.py --output /tmp/synthetic-fem-adaptive --plot
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-fem
          path: /tmp/synthetic-fem
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-fem-adaptive
          path: /tmp/synthetic-fem-adaptive
