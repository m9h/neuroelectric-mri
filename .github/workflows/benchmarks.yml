name: Benchmarks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  synthetic-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-simulation.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_references.py --check
      - run: python examples/mrs_current_benchmark.py --output /tmp/synthetic-mrs-current
